[env:esp32p4]
platform = https://github.com/platformio/platform-espressif32.git
framework = espidf
board = esp32-p4-ev-board
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D BOARD_HAS_PSRAM

; sdkconfig.defaults sitting next to this file is picked up automatically -
; no cmake_extra_args needed. (The previous version pointed
; SDKCONFIG_DEFAULTS at this file via cmake_extra_args, which isn't how
; component downloads work - managed component deps are declared in
; src/idf_component.yml instead, see that file.)

; TODO: confirm "esp32-p4-ev-board" is the exact board ID PlatformIO has
; registered for your specific Waveshare module - run
; `pio boards espressif32 | grep -i p4` to list the available P4 board IDs
; and swap this if it doesn't match.
